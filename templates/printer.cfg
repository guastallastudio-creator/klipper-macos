# Put your printer configuration here.
#
# 1. Start from the example for your board/printer in klipper/config/
#    (for example printer-anycubic-i3-mega-2017.cfg) and paste it below.
# 2. On macOS the serial port is /dev/cu.something, not /dev/serial/by-id/...
#    Find it with:   ls /dev/cu.*
#    (USB-serial chips usually show up as /dev/cu.usbserial-XXXX or /dev/cu.usbmodemXXXX)
# 3. Run "klipper-mac restart" (or press RESTART in Mainsail).

[include mainsail.cfg]

