# Moonraker on macOS (generated by klipper-macos)
# Listens on localhost only. Read the README before exposing it to your network.
[server]
host: 127.0.0.1
port: @MOONRAKER_PORT@
klippy_uds_address: @DATA@/comms/klippy.sock

[file_manager]
# inotify is Linux-only; klipper-mac-helper scans new G-code files instead
file_system_observer: none
enable_object_processing: True

[machine]
# no systemd / PolicyKit on macOS
provider: none
validate_service: False
validate_config: False

[authorization]
trusted_clients:
  127.0.0.1
  ::1
cors_domains:
  http://localhost:*
  http://127.0.0.1:*

[history]

# Lets slicers (Cura, PrusaSlicer, OrcaSlicer) upload to it as if it were OctoPrint
[octoprint_compat]
